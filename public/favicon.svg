<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a1a" stroke="url(#jetGradient)" stroke-width="2"/>
  
  <!-- Jet body -->
  <path d="M 32 12 L 36 28 L 34 40 L 32 42 L 30 40 L 28 28 Z" fill="url(#jetGradient)"/>
  
  <!-- Wings -->
  <path d="M 20 26 L 28 28 L 28 32 L 20 30 Z" fill="url(#jetGradient)"/>
  <path d="M 44 26 L 36 28 L 36 32 L 44 30 Z" fill="url(#jetGradient)"/>
  
  <!-- Cockpit -->
  <ellipse cx="32" cy="20" rx="2.5" ry="3" fill="#00ffff" opacity="0.8"/>
  
  <!-- Engine exhaust -->
  <path d="M 30 42 L 28 48 L 32 50 L 36 48 L 34 42 Z" fill="url(#accentGradient)"/>
  
  <!-- Engine glow effect -->
  <ellipse cx="32" cy="48" rx="4" ry="2" fill="#ff6b00" opacity="0.6"/>
  
  <!-- Wing details -->
  <line x1="22" y1="28" x2="26" y2="28" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="38" y1="28" x2="42" y2="28" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  
  <!-- Nose cone highlight -->
  <path d="M 31 12 L 32 12 L 32 16 L 31 16 Z" fill="#ffffff" opacity="0.4"/>
</svg>
